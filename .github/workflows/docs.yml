name: Deploy Documentation

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build documentation in Docker
        run: |
          # Create pages directory and fix permissions for Docker
          mkdir -p docs/pages
          sudo chown -R 1000:1000 ${{ github.workspace }}

          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ocaml/opam:ubuntu-22.04-ocaml-5.2 \
            bash -c '
              # Install build tools and all dependencies
              opam install dune odoc eio eio_main cstruct angstrom tls-eio x509 ca-certs domain-name alcotest --yes
              eval $(opam env)

              # Convert markdown files to mld (skip SUMMARY.md and README.md)
              # Use flat naming: docs/src/advanced/tx-dsl.md -> docs/pages-advanced-tx-dsl.mld
              echo "Converting markdown documentation..."
              find docs/src -name "*.md" -type f | while read -r mdfile; do
                # Skip SUMMARY.md and README.md files
                basename=$(basename "$mdfile")
                if [ "$basename" = "SUMMARY.md" ] || [ "$basename" = "README.md" ]; then
                  echo "Skipping: $mdfile"
                  continue
                fi

                # Convert path to flat name with hyphens
                relpath="${mdfile#docs/src/}"
                flatname=$(echo "${relpath%.md}" | tr "/" "-")
                mldfile="docs/pages-${flatname}.mld"

                echo "Converting: $mdfile -> $mldfile"

                # Convert markdown to odoc format (wrap content in verbatim to preserve syntax)
                echo "{0 $(basename "$mdfile" .md)}" > "$mldfile"
                echo "" >> "$mldfile"
                echo "{v" >> "$mldfile"
                cat "$mdfile" >> "$mldfile"
                echo "v}" >> "$mldfile"
              done

              # Update docs/dune to include all mld files
              echo "Generating docs/dune..."
              {
                echo "(documentation"
                echo " (package neo4j_eio)"
                echo " (mld_files"
                echo "  index pipelines extractors transactions streaming best-practices"
                find docs -name "pages-*.mld" -type f | sort | while read f; do
                  pagename=$(basename "$f" .mld)
                  echo "  $pagename"
                done
                echo " ))"
              } > docs/dune

              echo "Generated docs/dune:"
              cat docs/dune

              echo "Listing all .mld files:"
              find docs -name "*.mld" -type f | sort

              # Build documentation
              dune build @doc
            '

      - name: Prepare docs for upload
        run: |
          mkdir -p _site
          cp -r _build/default/_doc/_html/* _site/

          # Also copy original markdown for reference
          mkdir -p _site/markdown
          cp -r docs/src/* _site/markdown/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

