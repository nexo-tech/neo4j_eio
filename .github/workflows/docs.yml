name: Deploy Documentation

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build documentation in Docker
        run: |
          # Create pages directory and fix permissions for Docker
          mkdir -p docs/pages
          sudo chown -R 1000:1000 ${{ github.workspace }}

          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ocaml/opam:ubuntu-22.04-ocaml-5.2 \
            bash -c '
              opam install dune odoc --yes
              eval $(opam env)

              # Convert markdown files to mld
              echo "Converting markdown documentation..."
              find docs/src -name "*.md" -type f | while read -r mdfile; do
                relpath="${mdfile#docs/src/}"
                mldfile="docs/pages/${relpath%.md}.mld"
                mkdir -p "$(dirname "$mldfile")"

                # Convert markdown to odoc format
                echo "{0 $(basename "$mdfile" .md)}" > "$mldfile"
                echo "" >> "$mldfile"
                cat "$mdfile" | sed -E \
                  -e "s/^# (.+)/{1 \1}/" \
                  -e "s/^## (.+)/{2 \1}/" \
                  -e "s/^### (.+)/{3 \1}/" \
                  >> "$mldfile"
              done

              # Update docs/dune to include all mld files
              echo "(documentation" > docs/dune
              echo " (package neo4j_eio)" >> docs/dune
              echo " (mld_files" >> docs/dune
              echo "  index pipelines extractors transactions streaming best-practices" >> docs/dune
              find docs/pages -name "*.mld" -type f | while read f; do
                name=$(basename "$f" .mld)
                reldir=$(dirname "${f#docs/pages/}")
                if [ "$reldir" = "." ]; then
                  echo "  pages/$name" >> docs/dune
                else
                  echo "  pages/$reldir/$name" >> docs/dune
                fi
              done
              echo " ))" >> docs/dune

              # Build documentation
              dune build @doc
            '

      - name: Prepare docs for upload
        run: |
          mkdir -p _site
          cp -r _build/default/_doc/_html/* _site/

          # Also copy original markdown for reference
          mkdir -p _site/markdown
          cp -r docs/src/* _site/markdown/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

