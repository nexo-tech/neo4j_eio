name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: 5.2.x
          dune-cache: true

      - name: Pin package
        run: opam pin add neo4j_eio . --no-action --yes

      - name: Install dependencies
        run: opam install . --deps-only --yes

      - name: Build
        run: opam exec -- dune build

      - name: Check formatting
        run: opam exec -- dune build @fmt || true

  docs:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: 5.2.x
          dune-cache: true

      - name: Pin package
        run: opam pin add neo4j_eio . --no-action --yes

      - name: Install dependencies
        run: opam install . --deps-only --with-doc --yes

      - name: Build documentation
        run: opam exec -- dune build @doc

      - name: Check for broken links
        run: |
          if opam exec -- dune build @doc 2>&1 | grep -i "failed to resolve"; then
            echo "Warning: Some documentation links are broken"
          fi
